name: Build site
description: >
  Installs without lifecycle scripts, checks and builds site/ into site/dist. Runs with NO cloud
  credentials: call it only in a job that has no id-token permission and has not run an auth step.
  Firestore content, when used, is exported by an earlier job and passed in as content-export-dir.
inputs:
  content-source:
    description: git (content/ files) or firestore (use the snapshot in content-export-dir)
    default: git
  content-export-dir:
    description: Directory holding the exported snapshot (content-source firestore only)
    default: ''
  index-site:
    description: true only for the production host
    default: 'false'
  site-url:
    description: Canonical URL used in links, RSS, sitemap and Open Graph tags
    required: true
  project-id:
    required: true
  firebase-api-key:
    default: ''
  firebase-auth-domain:
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: site/package-lock.json
    - name: Check and build
      shell: bash
      working-directory: site
      run: npm ci --ignore-scripts && npm run typecheck && npm test && npm run build
      env:
        CONTENT_SOURCE: ${{ inputs.content-source }}
        CONTENT_EXPORT_DIR: ${{ inputs.content-export-dir }}
        INDEX_SITE: ${{ inputs.index-site }}
        SITE_URL: ${{ inputs.site-url }}
        VITE_FIREBASE_API_KEY: ${{ inputs.firebase-api-key }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ inputs.firebase-auth-domain }}
        VITE_FIREBASE_PROJECT_ID: ${{ inputs.project-id }}
