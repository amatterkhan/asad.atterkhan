name: Rebuild Vue site from published content
on:
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:
concurrency:
  group: site-content-rebuild
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment: site-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-redesign
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.SITE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SITE_BUILD_SERVICE_ACCOUNT }}
      - run: go run ./cmd/export
        working-directory: api
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_OWNER_UID: ${{ secrets.FIREBASE_OWNER_UID }}
      - run: npm ci
        working-directory: site
      - run: npm run typecheck && npm test && npm run build
        working-directory: site
        env:
          CONTENT_SOURCE: firestore
          INDEX_SITE: 'true'
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - run: npx --yes firebase-tools@15.34.1 deploy --only hosting --config firebase.json --project "$FIREBASE_PROJECT_ID" --non-interactive
        working-directory: site
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
