name: ASAD.EXE staging rollout
# Deliberately manual. Configure the protected asad-staging environment after approval.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  staging:
    if: startsWith(github.ref, 'refs/heads/codex/')
    environment: asad-staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
      BACKEND_ID: ${{ vars.FIREBASE_STAGING_BACKEND_ID }}
      PRODUCTION_PROJECT_ID: ${{ vars.FIREBASE_PRODUCTION_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Require isolated staging configuration
        run: |
          test -n "$PROJECT_ID"
          test -n "$BACKEND_ID"
          test "$PROJECT_ID" != "$PRODUCTION_PROJECT_ID"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_STAGING_SERVICE_ACCOUNT }}
      - name: Roll out reviewed commit to staging only
        run: npx firebase apphosting:rollouts:create "$BACKEND_ID" --project "$PROJECT_ID" --git-commit "$GITHUB_SHA" --force
